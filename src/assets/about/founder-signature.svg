<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 180" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
  <!-- Prominent flourished "S." -->
  <path d="M60 40
           C 40 32, 22 44, 22 62
           C 22 82, 60 88, 80 100
           C 100 112, 100 140, 76 148
           C 52 156, 28 146, 18 130"
        stroke-width="4.2"/>
  <!-- Dot after S -->
  <circle cx="102" cy="146" r="3.4" fill="currentColor" stroke="none"/>

  <!-- Flowing, illegible last-name script: single continuous flourish -->
  <path d="M120 120
           c 8 -18, 22 -22, 30 -10
           s -6 30, 6 32
           s 22 -22, 32 -14
           s -10 30, 4 30
           s 24 -30, 36 -18
           s -14 34, 2 34
           s 28 -32, 42 -22
           s -18 30, 0 32
           s 34 -28, 50 -18
           s -22 26, -4 28
           s 40 -18, 58 -6"
        stroke-width="2.6"/>

  <!-- Subtle underswash flourish -->
  <path d="M118 158 C 210 168, 330 168, 470 152"
        stroke-width="1.6" opacity="0.75"/>

  <!-- Tiny ascender loop above script (adds signature feel) -->
  <path d="M188 96 c 6 -14, 22 -14, 24 -2" stroke-width="1.8" opacity="0.85"/>
</svg>
